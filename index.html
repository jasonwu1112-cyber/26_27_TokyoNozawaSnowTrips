<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東京＆野澤溫泉 10 天 9 夜跨年滑雪之旅</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
<style>
  :root{
    color-scheme:dark;
    --app-header-height:0px;
    --bg:#0b1220; --bg-card:rgba(30,41,59,.72); --bg-card-solid:#1a2436;
    --text:#e6edf7; --text-dim:#93a1b8; --accent:#38bdf8; --accent2:#fbbf24;
    --border:rgba(148,163,184,.18); --danger:#f87171; --ok:#34d399;
    --animate-duration: .7s;
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#edf3f7; --bg-card:rgba(255,255,255,.92); --bg-card-solid:#fff;
    --text:#172235; --text-dim:#5d6b7d; --accent:#087ba5; --accent2:#9a6500;
    --border:rgba(51,65,85,.18); --danger:#c23d4b; --ok:#087b5b;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;padding-bottom:6.5rem;overflow-x:clip;color:var(--text);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6;
    background:radial-gradient(circle at 15% 0,rgba(56,189,248,.12),transparent 26rem),
      linear-gradient(180deg,#08111f 0%,#0b1424 55%,#08111f 100%);}
  a{color:var(--accent);}
  .app-wrap{max-width:520px;margin:0 auto;padding:0 1rem;}
  header.hero{position:sticky;top:0;z-index:30;width:100%;padding:1rem 0 .85rem;
    background:rgba(8,17,31,.9);border-bottom:1px solid var(--border);
    box-shadow:inset 0 -1px 0 rgba(56,189,248,.08);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    transition:transform .24s ease,opacity .2s ease;}
  body.header-hidden:not(.home-active) header.hero{transform:translateY(calc(-100% - 1px));opacity:0;pointer-events:none;}
  header.hero .app-wrap{padding-right:4.5rem;}
  body.home-active header.hero{display:none;}
  header.hero .tag{display:inline-flex;align-items:center;gap:.4rem;color:var(--accent2);font-weight:700;font-size:.7rem;margin:0;text-transform:uppercase;}
  header.hero h1{font-size:1.12rem;margin:.1rem 0;font-weight:800;letter-spacing:0;}
  header.hero .dates{display:inline-flex;align-items:center;gap:.45rem;max-width:100%;margin-top:.32rem;padding:.2rem .65rem;
    border:1px solid rgba(56,189,248,.35);border-radius:999px;background:rgba(56,189,248,.12);color:var(--accent);
    font-size:.82rem;font-weight:800;letter-spacing:.035em;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.35;}
  header.hero .dates::before{content:"";flex:none;width:.4rem;height:.4rem;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.14);}
  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.2rem;margin:1rem 0;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
  section.card[id]{scroll-margin-top:4.2rem;}
  .card h2{font-size:1.05rem;margin:0 0 .8rem;display:flex;align-items:center;gap:.4rem;color:#fff;}
  .card h2 .n{color:var(--accent);}
  .pill{display:inline-block;padding:.15rem .55rem;border-radius:999px;font-size:.72rem;font-weight:700;background:rgba(56,189,248,.15);color:var(--accent);border:1px solid rgba(56,189,248,.3);}
  .pill.gold{background:rgba(251,191,36,.15);color:var(--accent2);border-color:rgba(251,191,36,.3);}
  .pill.pending{background:rgba(148,163,184,.15);color:var(--text-dim);border-color:var(--border);}
  ul.pretrip-todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem;}
  .todo-item{display:flex;gap:.5rem;align-items:flex-start;font-size:.85rem;background:rgba(148,163,184,.08);padding:.5rem .6rem;border-radius:10px;}
  .reminder-item{align-items:center;}
  .reminder-item::before{content:"";flex:0 0 9px;height:9px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 4px rgba(248,113,113,.14);}
  .todo-deadline{color:var(--accent2);font-weight:700;white-space:nowrap;font-size:.72rem;}
  .todo-text{font-size:.8rem;}
  .reminder-badge{display:inline-block;margin-left:.4rem;font-size:.7rem;background:rgba(248,113,113,.15);color:var(--danger);border:1px solid rgba(248,113,113,.35);padding:.1rem .5rem;border-radius:999px;}
  .kv{font-size:.85rem;margin:.4rem 0;}
  .kv b{color:#fff;}
  .disclaimer-box{font-size:.78rem;color:var(--text-dim);background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.25);border-radius:12px;padding:.8rem .9rem;}
  #map-section.card{padding:.8rem;}
  #map{width:100%;height:calc(100vh - 245px);min-height:390px;border-radius:14px;border:1px solid var(--border);}
  #map.map-unavailable{height:auto;min-height:180px;display:grid;place-items:center;padding:1.5rem;text-align:center;background:var(--bg-card);color:var(--text-dim);}
  .map-tile-warning{position:absolute;z-index:800;left:.7rem;right:.7rem;top:.7rem;margin:0;padding:.7rem;border-radius:8px;background:var(--bg-card-solid);color:var(--text);box-shadow:0 2px 12px rgba(0,0,0,.25);font-size:.8rem;}
  .map-head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;}
  .map-head-actions{display:flex;align-items:center;gap:.5rem;margin-left:auto;}
  .map-back-btn{min-height:32px;padding:.25rem .65rem;border:1px solid rgba(56,189,248,.4);border-radius:999px;background:rgba(56,189,248,.14);color:var(--accent);font:inherit;font-size:.72rem;font-weight:700;cursor:pointer;white-space:nowrap;}
  .map-back-btn[hidden]{display:none;}
  .map-state{font-size:.72rem;color:var(--text-dim);white-space:nowrap;}
  .tabs{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:.8rem;}
  .tabs::-webkit-scrollbar{height:4px;}
  .tab-btn{flex:none;padding:.4rem .8rem;border-radius:999px;border:1px solid var(--border);background:rgba(148,163,184,.08);color:var(--text-dim);font-size:.78rem;font-weight:700;cursor:pointer;}
  .tab-btn.active{background:linear-gradient(135deg,var(--accent),#0284c7);color:#fff;border-color:transparent;}
  #mapDayTabs{margin-bottom:.7rem;}
  #itinerary-section.card{background:transparent;border:0;padding:0;-webkit-backdrop-filter:none;backdrop-filter:none;}
  #itinerary-section.app-view.active{animation:none;}
  #dayTabs,#moreQuickNav{position:sticky;top:var(--app-header-height);z-index:60;margin:0 -1rem .8rem;padding:.55rem 1rem;background:rgba(8,17,31,.96);border-bottom:1px solid var(--border);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 6px 18px rgba(0,0,0,.18);scrollbar-width:none;}
  .more-quicknav.app-view.active{display:flex;}
  .more-quicknav [hidden]{display:none;}
  body.header-hidden #dayTabs,body.header-hidden #moreQuickNav{top:0;}
  #dayTabs::-webkit-scrollbar,#moreQuickNav::-webkit-scrollbar{display:none;}
  .day-card{display:none;}
  .day-card.show{display:block;}
  .day-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.4rem;margin-bottom:.3rem;}
  .day-theme{font-size:1.05rem;font-weight:800;color:#fff;margin:.2rem 0 .45rem;}
  .day-notes-details{margin:.35rem 0 .9rem;border:1px solid var(--border);border-radius:10px;background:rgba(148,163,184,.06);}
  .day-notes-details > summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-height:40px;padding:.45rem .75rem;color:var(--accent2);font-size:.78rem;font-weight:700;cursor:pointer;user-select:none;}
  .day-notes-details > summary::-webkit-details-marker{display:none;}
  .day-notes-toggle{color:var(--accent);font-size:.72rem;font-weight:700;white-space:nowrap;}
  .day-notes-toggle .close-label{display:none;}
  .day-notes-details[open] > summary{border-bottom:1px solid var(--border);}
  .day-notes-details[open] .day-notes-toggle .open-label{display:none;}
  .day-notes-details[open] .day-notes-toggle .close-label{display:inline;}
  .day-notes-body{padding:.6rem .75rem;}
  .day-tips{font-size:.78rem;color:var(--accent2);background:rgba(251,191,36,.08);border-radius:10px;padding:.5rem .7rem;margin:.5rem 0;}
  .day-notes-body .day-tips:first-child{margin-top:0;}
  .day-notes-body > :last-child{margin-bottom:0;}
  .transport-guide{margin:.65rem 0 0;padding:.85rem .9rem;border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;background:var(--bg-card);}
  .transport-guide h3{margin:0 0 .2rem;font-size:.96rem;color:var(--text);}
  .transport-route{margin:0 0 .8rem;color:var(--accent);font-size:.78rem;font-weight:700;}
  .transport-steps{list-style:none;counter-reset:transport;margin:0;padding:0;}
  .transport-steps li{counter-increment:transport;position:relative;padding:.45rem 0 .45rem 2rem;border-top:1px solid var(--border);font-size:.78rem;}
  .transport-steps li::before{content:counter(transport);position:absolute;top:.55rem;left:0;width:1.35rem;height:1.35rem;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:#fff;font-size:.7rem;font-weight:800;}
  .transport-steps b{display:block;color:var(--text);font-size:.82rem;}
  .transport-steps p{margin:.15rem 0 0;color:var(--text-dim);}
  .transport-note{margin:.65rem 0 0;padding:.55rem .7rem;border-radius:8px;background:rgba(148,163,184,.09);font-size:.76rem;}
  .transport-warning{border-left:2px solid var(--accent2);}
  .transport-sources{display:flex;flex-wrap:wrap;gap:.35rem .8rem;margin-top:.7rem;font-size:.73rem;}
  .tax-refund-summary{margin:.3rem 0 .7rem;font-size:.85rem;font-weight:700;}
  #tax-refund-section[hidden],#vjw-section[hidden],#onsen-section[hidden]{display:none;}
  .onsen-list{margin-top:.8rem;}
  .onsen-table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:.78rem;line-height:1.55;}
  .onsen-table .bath-column{width:22%;}
  .onsen-table .temperature-column{width:28%;}
  .onsen-table .selection-column{width:50%;}
  .onsen-table th,.onsen-table td{padding:.7rem .55rem;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;overflow-wrap:anywhere;}
  .onsen-table thead th{background:rgba(148,163,184,.08);color:var(--text-dim);font-size:.72rem;}
  .onsen-table tbody th{font-weight:700;}
  .onsen-table .onsen-temperature{margin:0;font-size:inherit;}
  .onsen-priority,.onsen-record-status{margin-top:.3rem;color:var(--text-dim);font-size:.7rem;font-weight:400;}
  .onsen-selection{margin:0;}
  .onsen-record{margin-top:.3rem;font-weight:400;}
  .onsen-record summary{min-height:44px;padding:.55rem 0;cursor:pointer;color:var(--accent);font-weight:700;}
  .onsen-record p{margin:.4rem 0;color:var(--text-dim);}
  .onsen-availability{margin-top:.35rem;color:var(--danger);font-size:.72rem;font-weight:700;}
  @media (max-width:520px){
    .onsen-table .bath-column{width:26%;}
    .onsen-table .temperature-column{width:32%;}
    .onsen-table .selection-column{width:42%;}
    .onsen-table th,.onsen-table td{padding:.6rem .3rem;}
  }
  .onsen-temperature{margin:.35rem 0;color:var(--accent2);font-size:.82rem;font-weight:700;}
  .onsen-plan{list-style:none;margin:.75rem 0;padding:0;}
  .onsen-plan li{padding:.55rem 0;border-top:1px solid var(--border);font-size:.8rem;}
  .onsen-slot-info{margin:.6rem 0;}
  .onsen-slot-info p{margin:.3rem 0;}
  .tax-refund-details .vjw-checklist{list-style:none;margin:.6rem 0 0;padding:0;}
  .vjw-checklist label{display:flex;align-items:flex-start;gap:.6rem;padding:.55rem 0;font-size:.78rem;color:var(--text-dim);cursor:pointer;}
  .vjw-checklist input{flex:none;width:18px;height:18px;margin:.15rem 0 0;accent-color:var(--accent);}
  .vjw-checklist label:has(input:checked) span{text-decoration:line-through;opacity:.65;}
  .tax-refund-details{border-top:1px solid var(--border);padding:.65rem 0;}
  .tax-refund-details summary{cursor:pointer;font-size:.82rem;font-weight:700;}
  .tax-refund-details ul{margin:.6rem 0 0;padding-left:1.1rem;font-size:.78rem;color:var(--text-dim);}
  .tax-refund-details li+li{margin-top:.5rem;}
  .tax-refund-link{display:inline-flex;align-items:center;min-height:40px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--accent);padding:.45rem .7rem;font:inherit;font-size:.76rem;font-weight:700;cursor:pointer;}
  .alt-box{display:flex;flex-direction:column;gap:.5rem;margin:.6rem 0;}
  .alt-item{border:1px dashed var(--border);border-radius:10px;padding:.5rem .6rem;font-size:.78rem;}
  .alt-item b{color:#fff;}
  .slot{position:relative;margin:0 0 0 5.8rem;border:0;border-left:1px solid var(--border);border-radius:0;padding:.15rem 0 1.2rem 1rem;background:transparent;}
  .slot.slot-return-highlight{background:rgba(56,189,248,.1);border-radius:0 10px 10px 0;transition:background .35s ease;}
  .slot::before{content:"";position:absolute;left:-5px;top:.45rem;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px #0b1424;}
  .slot-flight::before{background:var(--accent2);}
  .slot-stay::before{background:var(--ok);}
  .slot .period-tag{display:none;}
  .slot .slot-name{font-size:.92rem;font-weight:800;color:#fff;margin:0 0 .35rem;}
  .map-number{display:inline-block;margin-left:.4rem;padding:.08rem .42rem;border:1px solid rgba(56,189,248,.35);border-radius:999px;background:rgba(56,189,248,.12);color:var(--accent);font:inherit;font-size:.67rem;font-weight:700;vertical-align:middle;cursor:pointer;}
  .slot .slot-time{position:absolute;right:calc(100% + 1.1rem);top:.12rem;width:4.6rem;text-align:right;color:var(--accent2);font-size:.7rem;font-weight:800;white-space:normal;overflow-wrap:anywhere;line-height:1.35;}
  .photo-frame{position:relative;width:100%;max-height:210px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;margin:.5rem 0;
    background:linear-gradient(135deg,var(--accent),var(--accent2));}
  .photo-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#0b1220;font-weight:800;font-size:.85rem;text-align:center;padding:.5rem;}
  .photo-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .slot .review{color:var(--text-dim);font-size:.78rem;margin:.4rem 0;}
  .review-details{margin:.4rem 0;color:var(--text-dim);font-size:.78rem;}
  .review-details summary{list-style:none;cursor:pointer;}
  .review-details summary::-webkit-details-marker{display:none;}
  .review-preview{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden;}
  .review-toggle{display:inline-block;margin-top:.35rem;color:var(--accent);font-size:.72rem;font-weight:700;}
  .review-toggle .close-label{display:none;}
  .review-details[open] .review-preview{display:none;}
  .review-details[open] .open-label{display:none;}
  .review-details[open] .close-label{display:inline;}
  .review-full{margin-top:.25rem;}
  .meta-tags{display:flex;flex-wrap:wrap;gap:.35rem;margin:.4rem 0;}
  .meta-tags span{font-size:.68rem;background:rgba(148,163,184,.12);border:1px solid var(--border);border-radius:999px;padding:.15rem .5rem;color:var(--text-dim);}
  .dining-item{border-left:3px solid var(--accent2);padding:.5rem .7rem;background:rgba(251,191,36,.05);border-radius:0 10px 10px 0;margin-bottom:.5rem;font-size:.82rem;}
  .dishes{color:var(--text-dim);font-size:.75rem;margin-top:.2rem;}
  .timeline-detail{padding:.65rem .7rem;border:1px solid var(--border);border-radius:8px;background:rgba(148,163,184,.06);font-size:.78rem;color:var(--text-dim);}
  .timeline-detail strong{display:block;margin-bottom:.2rem;color:#fff;font-size:.86rem;}
  .timeline-detail-row{margin-top:.25rem;}
  .slot-maplinks{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.55rem;}
  .slot-maplinks a{min-height:28px;display:inline-flex;align-items:center;font-size:.64rem;color:#062033;text-decoration:none;border:1px solid transparent;
    border-radius:6px;padding:.22rem .42rem;background:var(--accent);font-weight:800;}
  .slot-maplinks a:hover{background:#7dd3fc;}
  .slot-maplinks a.booking-action{background:var(--accent2);color:#241800;}
  .slot-maplinks a.booking-action:hover{background:#fcd34d;}
  ul.tips-list{margin:0;padding-left:1.1rem;font-size:.85rem;}
  ul.tips-list li{margin-bottom:.4rem;}
  footer{text-align:center;color:var(--text-dim);font-size:.72rem;margin-top:2rem;}
  .last-modified{margin-top:.3rem;color:var(--text-dim);font-size:.7rem;font-weight:400;line-height:1.5;}
  .last-modified time{font:inherit;font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-variant-numeric:tabular-nums;}
  .app-view{display:none;animation:app-view-in .28s ease both;}
  .app-view.active{display:block;}
  @keyframes app-view-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .today-hero{position:relative;isolation:isolate;overflow:hidden;width:100vw;min-height:calc(100vh - 70px);min-height:calc(100svh - 70px);margin:0 0 0 calc(50% - 50vw);padding:0;border:0;border-radius:0;background:#152338;display:flex;align-items:flex-end;}
  .today-hero::before{content:"";position:absolute;z-index:1;inset:0;background:linear-gradient(180deg,rgba(4,12,24,.08) 18%,rgba(4,12,24,.48) 54%,rgba(4,12,24,.96) 100%);}
  .cover-image{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;}
  .cover-content{position:relative;z-index:2;width:min(100%,520px);margin:0 auto;padding:1.5rem 1rem 2rem;text-shadow:0 2px 16px rgba(0,0,0,.6);}
  .cover-location{position:absolute;z-index:2;top:max(1rem,env(safe-area-inset-top));right:1rem;padding:.35rem .55rem;border:1px solid rgba(255,255,255,.22);border-radius:6px;background:rgba(4,12,24,.36);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:rgba(255,255,255,.86);font-size:.68rem;font-weight:700;}
  .cover-trip-title{font-size:2.15rem;line-height:1.08;margin:.35rem 0 .25rem;color:#fff;letter-spacing:0;max-width:11em;}
  .cover-trip-subtitle{margin:0 0 .3rem;color:rgba(255,255,255,.9);font-size:1rem;font-weight:700;}
  .cover-dates{font-size:.78rem;color:rgba(255,255,255,.78);}
  .today-kicker{color:var(--accent);font-size:.7rem;font-weight:800;text-transform:uppercase;}
  .today-date{color:var(--accent2);font-size:.78rem;font-weight:700;margin-top:1.25rem;}
  .today-hero h2{font-size:1.4rem;line-height:1.25;margin:.2rem 0 .25rem;max-width:90%;}
  .today-theme{color:rgba(255,255,255,.78);font-size:.84rem;}
  .next-card{margin-top:1rem;border-left:3px solid var(--accent);padding:.75rem .85rem;background:rgba(4,12,24,.54);border-radius:0 8px 8px 0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
  .next-label{font-size:.68rem;font-weight:800;color:var(--accent);text-transform:uppercase;}
  .next-time{font-size:1.35rem;font-weight:800;color:#fff;margin:.15rem 0;}
  .next-name{font-size:.9rem;}
  .action-row{display:flex;gap:.55rem;margin-top:.85rem;}
  .app-action{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;padding:.65rem .9rem;border:1px solid rgba(56,189,248,.35);
    border-radius:8px;background:rgba(56,189,248,.12);color:#fff;font:inherit;font-size:.78rem;font-weight:700;text-decoration:none;cursor:pointer;}
  .action-row .app-action{flex:1;}
  .app-action.primary{background:var(--accent);color:#062033;border-color:transparent;}
  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:1rem 0;}
  .summary-card{margin:0;padding:.9rem;min-height:112px;}
  .summary-card-action{cursor:pointer;transition:border-color .18s ease,transform .18s ease;}
  .summary-card-action:hover,.summary-card-action:focus-visible{border-color:var(--accent);transform:translateY(-1px);}
  .summary-label{display:flex;align-items:center;justify-content:space-between;color:var(--text-dim);font-size:.7rem;font-weight:700;}
  .summary-value{margin-top:.35rem;color:#fff;font-size:.9rem;font-weight:800;line-height:1.35;}
  .summary-note{margin-top:.3rem;color:var(--text-dim);font-size:.72rem;}
  .weather-value{display:flex;align-items:center;gap:.4rem;}
  .weather-icon{font-size:1.15rem;}
  .weather-head{display:flex;align-items:center;justify-content:space-between;gap:.4rem;}
  .weather-location-select{max-width:6.2rem;border:1px solid var(--border);border-radius:6px;background:#111d30;color:var(--text);padding:.2rem .3rem;font:inherit;font-size:.65rem;}
  .weather-links{display:flex;gap:.55rem;margin-top:.35rem;font-size:.66rem;}
  .weather-links a{text-decoration:none;font-weight:700;}

<script>
// ===== map.js（原樣內聯，來自 travel-plan-viz skill assets/map.js） =====
function escapeHTML(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function safeExternalURL(value) {
  try {
    var url = new URL(value);
    return url.protocol === 'https:' ? url.href : '';
  } catch (e) {
    return '';
  }
}
function buildMapAppLinks(lat, lng, label) {
  return [{
    label: 'Google 地圖導航',
    url: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(lat + ',' + lng),
  }];
}
var GCJ_A = 6378245.0;
var GCJ_EE = 0.00669342162296594323;
function isInChinaBBox(lat, lng) {
  return lng >= 72.004 && lng <= 137.8347 && lat >= 0.8293 && lat <= 55.8271;
}
function gcjTransformLat(x, y) {
  var ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
  ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320.0 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
  return ret;
}
function gcjTransformLng(x, y) {
  var ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
  ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
  return ret;
}
function gcj02ToWgs84(lat, lng) {
  if (!isInChinaBBox(lat, lng)) return { lat: lat, lng: lng };
  var dLat = gcjTransformLat(lng - 105.0, lat - 35.0);
  var dLng = gcjTransformLng(lng - 105.0, lat - 35.0);
  var radLat = lat / 180.0 * Math.PI;
  var magic = Math.sin(radLat);
  magic = 1 - GCJ_EE * magic * magic;
  var sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((GCJ_A * (1 - GCJ_EE)) / (magic * sqrtMagic) * Math.PI);
  dLng = (dLng * 180.0) / (GCJ_A / sqrtMagic * Math.cos(radLat) * Math.PI);
  return { lat: lat - dLat, lng: lng - dLng };
}
function routeCoordinates(points) {
  return points.map(function (p) { return [p.lat, p.lng]; });
}
function initTravelMap(elementId, points, opts) {
  opts = opts || {};
  var container = document.getElementById(elementId);
  if (typeof L === 'undefined' || navigator.onLine === false) {
    container.classList.add('map-unavailable');
    container.textContent = '目前無法載入互動地圖；行程文字仍可閱讀。請連線後重新整理以使用地圖與導航。';
    return { setTravelPoints: function () {}, invalidateSize: function () {}, openTravelPoint: function () {} };
  }
  var map = L.map(elementId);
  var tileWarning = document.createElement('p');
  tileWarning.className = 'map-tile-warning';
  tileWarning.textContent = '地圖圖磚暫時無法載入；行程與地點資訊仍可閱讀。';
  tileWarning.hidden = true;
  container.appendChild(tileWarning);
  L.tileLayer(opts.tileUrl || 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: opts.attribution || '© OpenStreetMap contributors',
    maxZoom: 19,
  }).on('tileerror', function () { tileWarning.hidden = false; })
    .on('tileload', function () { tileWarning.hidden = true; }).addTo(map);
  var markerLayer = L.layerGroup().addTo(map);
  var routeLine;
  var markersByNumber = {};
  map.setTravelPoints = function (nextPoints) {
    markerLayer.clearLayers();
    markersByNumber = {};
    if (routeLine) map.removeLayer(routeLine);
    nextPoints.forEach(function (p, i) {
      var number = p.number || (i + 1);
      var icon = L.divIcon({
        className: 'route-pin',
        html: '<span style="background:linear-gradient(135deg,#38bdf8,#0284c7);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;">' + number + '</span>',
        iconSize: [28, 28],
        iconAnchor: [14, 14],
      });
      var navLinks = buildMapAppLinks(p.lat, p.lng, p.name);
      var marker = L.marker([p.lat, p.lng], { icon: icon }).addTo(markerLayer).bindPopup(
        '<b>地圖 #' + number + ' · ' + escapeHTML(p.name) + '</b><br>'
        + (p.time ? escapeHTML(p.time) + '<br>' : '')
        + (p.locationNote ? escapeHTML(p.locationNote) + '<br>' : '')
        + navLinks.map(function (l) {
            return '<a href="' + l.url + '" target="_blank" rel="noopener">' + escapeHTML(l.label) + '</a>';
          }).join(' · ')
      );
          markersByNumber[number] = marker;
    });
    var coords = routeCoordinates(nextPoints);
    if (coords.length > 1) {
      routeLine = L.polyline(coords, { dashArray: '6 8', weight: 2, color: '#38bdf8' }).addTo(map);
    }
    if (coords.length) map.fitBounds(coords, { padding: [30, 30] });
  };
  map.openTravelPoint = function (number) {
    var marker = markersByNumber[number];
    if (!marker) return;
    map.panTo(marker.getLatLng());
    marker.openPopup();
  };
  map.setTravelPoints(points);
  return map;
}
</script>

<script>
// ===== reminders.js（原樣內聯，來自 travel-plan-viz skill assets/reminders.js） =====
function computeReminders(startDateISO, items) {
  return items
    .map(function (it) {
      var d = new Date(startDateISO + 'T00:00:00Z');
      d.setUTCDate(d.getUTCDate() - it.leadDays);
      return { item: it.item, leadDays: it.leadDays, deadline: d.toISOString().slice(0, 10) };
    })
    .sort(function (a, b) {
      return a.deadline < b.deadline ? -1 : a.deadline > b.deadline ? 1 : 0;
    });
}
function renderChecklistHTML(reminders) {
  var lis = reminders.map(function (r) {
    return '<li class="todo-item reminder-item">'
      + '<span class="todo-deadline">' + r.deadline + '前</span> '
      + '<span class="todo-text">' + escapeHTML(r.item) + '（建議提前' + r.leadDays + '天）</span>'
      + '</li>';
  }).join('');
  return '<ul class="pretrip-todo">' + lis + '</ul>';
}
function reminderBadgeHTML(leadDays) {
  return '<span class="reminder-badge animate__animated animate__pulse animate__slower animate__infinite">⚠️ 建議提前' + leadDays + '天訂</span>';
}
</script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var trip = JSON.parse(document.getElementById('trip-data').textContent);

  // 依出發日計算重要提醒，不提供勾選狀態。
  var reminders = computeReminders(trip.startDate, trip.reminders);
  document.getElementById('checklist').innerHTML = renderChecklistHTML(reminders);

  function startTime(value) {
    var match = String(value || '').match(/\d{1,2}:\d{2}/);
    return match ? match[0] : String(value || '彈性');
  }

  function tripClock(date) {
    var parts = {};
    new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    }).formatToParts(date).forEach(function (part) { parts[part.type] = part.value; });
    return { date: parts.year + '-' + parts.month + '-' + parts.day,
      minutes: Number(parts.hour) * 60 + Number(parts.minute) };
  }

  function slotTimeRange(value) {
    var times = [...String(value || '').matchAll(/(\d{1,2}):(\d{2})/g)]
      .map(function (match) { return Number(match[1]) * 60 + Number(match[2]); });
    return times.length ? { start: times[0], end: times.length > 1 ? times[1] : null,
      after: /後/.test(value) } : null;
  }

  function nextTripStop(slots, state, now) {
    var minutes = tripClock(now).minutes;
    if (state.dayIndex > 0) {
      var previousSlots = trip.days[state.dayIndex - 1].slots || [];
      var overnight = previousSlots.find(function (slot) {
        var range = slotTimeRange(slot.time);
        return range && range.end !== null && range.end < range.start && minutes < range.end;
      });
      if (overnight) return { slot: overnight, label: '前一日行程進行中' };
    }
    var current = null;
    var upcoming = null;
    slots.forEach(function (slot) {
      var range = slotTimeRange(slot.time);
      if (!range) return;
      if (range.start <= minutes && (range.end !== null
        ? (range.end < range.start || minutes < range.end)
        : range.after)) {
        if (!current || range.start > current.start) current = { slot: slot, start: range.start };
      } else if (range.start > minutes && (!upcoming || range.start < upcoming.start)) {
        upcoming = { slot: slot, start: range.start };
      }
    });
    return current ? { slot: current.slot, label: '進行中' }
      : upcoming ? { slot: upcoming.slot, label: '下一站' } : null;
  }

  function shortDate(value) {
    var parts = value.split('-');
    return Number(parts[1]) + '/' + Number(parts[2]);
  }

  function lodgingForDate(date) {
    var match = null;
    (trip.hotelAreas || []).some(function (hotel) {
      return (hotel.options || []).some(function (option) {
        if (option.checkIn && option.checkOut && date >= option.checkIn && date < option.checkOut) {
          match = { area: hotel.area, reason: hotel.reason, option: option };
          return true;
        }
        return false;
      });
    });
    return match;
  }

  function renderFlightSlot(flight) {
    if (!flight) return '';
    return '<div class="slot slot-flight">'
      + '<div class="slot-name">✈️ ' + escapeHTML(flight.label) + ' <span class="pill">已預訂</span></div>'
      + '<div class="slot-time">' + escapeHTML(startTime(flight.time)) + '</div>'
      + '<div class="timeline-detail"><strong>' + escapeHTML(flight.code || flight.label) + '</strong>' + escapeHTML(flight.time) + '</div>'
      + '</div>';
  }

  function weatherDescription(code) {
    if (code === 0) return { icon: '☀', text: '晴朗' };
    if (code <= 2) return { icon: '🌤', text: '晴時多雲' };
    if (code === 3) return { icon: '☁', text: '陰天' };
    if (code === 45 || code === 48) return { icon: '🌫', text: '有霧' };
    if (code >= 51 && code <= 67) return { icon: '🌧', text: '有雨' };
    if (code >= 71 && code <= 77) return { icon: '❄', text: '降雪' };
    if (code >= 80 && code <= 82) return { icon: '🌦', text: '陣雨' };
    if (code === 85 || code === 86) return { icon: '🌨', text: '陣雪' };
    if (code >= 95) return { icon: '⛈', text: '雷雨' };
    return { icon: '◌', text: '天氣資料' };
  }

  var weatherRequestToken = 0;

  function weatherSelectorHTML(selectedKey) {
    return '<select class="weather-location-select" aria-label="選擇天氣地點">'
      + '<option value="current"' + (selectedKey === 'current' ? ' selected' : '') + '>目前位置</option>'
      + '<option value="tokyo"' + (selectedKey === 'tokyo' ? ' selected' : '') + '>東京</option>'
      + '<option value="nozawa"' + (selectedKey === 'nozawa' ? ' selected' : '') + '>野澤</option>'
      + '</select>';
  }

  function weatherHeaderHTML(selectedKey) {
    return '<div class="weather-head"><div class="summary-label">目前天氣</div>' + weatherSelectorHTML(selectedKey) + '</div>';
  }

  function weatherLinksHTML(location) {
    var tenkiUrl = safeExternalURL(location.tenkiUrl);
    return '<div class="weather-links"><a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>'

      + '<div class="summary-note">' + escapeHTML(location.seasonal) + ' · 動態資料暫時無法取得</div>' + weatherLinksHTML(location);

  function updateHomeWeather(dayIndex, selectedKey, customLocation) {
    var locations = trip.weatherLocations || {};
    var defaultKey = dayIndex >= 2 && dayIndex <= 6 ? 'nozawa' : 'tokyo';
    var weatherKey = selectedKey || defaultKey;
    var location = customLocation || locations[weatherKey] || locations[defaultKey];
    var card = document.getElementById('weatherCard');
    if (!location || !card) return;
    var requestToken = ++weatherRequestToken;
    card.innerHTML = weatherHeaderHTML(weatherKey) + '<div class="summary-value">載入中…</div><div class="summary-note">' + escapeHTML(location.label) + '</div>';
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + location.lat + '&longitude=' + location.lng
      + '&current=temperature_2m,apparent_temperature,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1';
    fetch(url).then(function (response) {
      if (!response.ok) throw new Error('Weather request failed');
      return response.json();
    }).then(function (data) {
      if (requestToken !== weatherRequestToken) return;
      var current = data.current;
      var daily = data.daily;
      var weather = weatherDescription(current.weather_code);
      var updatedAt = String(current.time || '').slice(11, 16);
      card.innerHTML = weatherHeaderHTML(weatherKey)
        + '<div class="summary-value weather-value"><span class="weather-icon">' + weather.icon + '</span><span>' + Math.round(current.temperature_2m) + '°C</span></div>'
        + '<div class="summary-note">' + escapeHTML(location.label) + ' · ' + weather.text + ' · 體感 ' + Math.round(current.apparent_temperature) + '°C<br>今日 ' + Math.round(daily.temperature_2m_min[0]) + '–' + Math.round(daily.temperature_2m_max[0]) + '°C · ' + updatedAt + ' 更新</div>'
        + weatherLinksHTML(location);
    }).catch(function () {
      if (requestToken === weatherRequestToken) renderWeatherFallback(card, location, weatherKey);
    });
  }

      }
      html += '</div>';
      var lodgingMapLink = buildMapAppLinks(s.lat, s.lng, lodgingName)[0];
      html += '<div class="slot-maplinks"><a href="' + lodgingMapLink.url + '" target="_blank" rel="noopener">' + escapeHTML(lodgingMapLink.label) + '</a></div>';
      html += '</div>';
    });
    if (di === trip.days.length - 1) html += renderFlightSlot(bookedFlights[bookedFlights.length - 1]);
    html += '</div>';
  });
  dayCardsEl.innerHTML = html;

  // 地圖頁也能直接切換全程或單日標記。
  var mapDayTabsEl = document.getElementById('mapDayTabs');
  [{ id: 'all', label: '全部' }].concat(trip.days.map(function (day, index) {
    return { id: 'day' + (index + 1), label: 'D' + (index + 1) + ' ' + shortDate(day.date) };
  })).forEach(function (item) {
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'tab-btn' + (item.id === 'all' ? ' active' : '');
    button.dataset.day = item.id;
    button.textContent = item.label;
    mapDayTabsEl.appendChild(button);
  });

  var lastClickedSlotEl = null;
  var backToSlotBtn = document.getElementById('backToSlotBtn');
  var moreQuickNavEl = document.getElementById('moreQuickNav');

  function setActiveMoreChip(targetId) {
    if (!moreQuickNavEl) return;
    moreQuickNavEl.querySelectorAll('.tab-btn').forEach(function (b) {
      b.classList.toggle('active', b.dataset.moreTarget === targetId);
    });
    var activeChip = moreQuickNavEl.querySelector('.tab-btn.active');
    if (activeChip && moreQuickNavEl.clientWidth) {
      moreQuickNavEl.scrollTo({
        left: Math.max(0, activeChip.offsetLeft - (moreQuickNavEl.clientWidth - activeChip.offsetWidth) / 2),
        behavior: 'smooth'
      });
    }
  }

  function centerActiveDayTabs() {
    [dayTabsEl, mapDayTabsEl].forEach(function (tabsEl) {
      var activeBtn = tabsEl.querySelector('.tab-btn.active');
      if (activeBtn && tabsEl.clientWidth) {
        tabsEl.scrollTo({
          left: Math.max(0, activeBtn.offsetLeft - (tabsEl.clientWidth - activeBtn.offsetWidth) / 2),
          behavior: 'smooth'
        });
      }
    });
  }

  // Tab 切換（切換時淡入新內容），抽成可重用函數供快速導覽列直接呼叫
  function selectDay(day) {
    document.querySelectorAll('#dayTabs .tab-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.day === day); });
    document.querySelectorAll('#mapDayTabs .tab-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.day === day); });
    centerActiveDayTabs();
    document.querySelectorAll('.day-card').forEach(function (card) {
      var willShow = day === 'all' || card.dataset.day === day;
      card.classList.toggle('show', willShow);
      if (willShow) {
        card.querySelectorAll('img[data-src]').forEach(function (image) {
          image.src = image.dataset.src;
          image.removeAttribute('data-src');
        });
      }
      if (willShow) {
        card.classList.remove('animate__fadeIn');
        void card.offsetWidth;
        card.classList.add('animate__animated', 'animate__fadeIn');
      }
    });
    if (lastClickedSlotEl && !lastClickedSlotEl.closest('.day-card.show')) {
      backToSlotBtn.hidden = true;
    }
    var numberLabels = day === 'all'
      ? document.querySelectorAll('.map-number')
      : document.querySelectorAll('.day-card.show .map-number');
    numberLabels.forEach(function (label, index) {
      var displayNumber = day === 'all' ? Number(label.dataset.mapNumber) : index + 1;
      label.dataset.displayNumber = displayNumber;
      label.textContent = '地圖 #' + displayNumber;
    });
    updateTravelMap(day);
  }
  document.getElementById('dayTabs').addEventListener('click', function (e) {
    var btn = e.target.closest('.tab-btn');
    if (!btn) return;
    selectDay(btn.dataset.day);
    var dayHeading = dayCardsEl.querySelector('.day-card.show .day-head');
    if (!dayHeading) return;
    // 日期切換後以當日日期標題為落點；隱藏頂部列讓日期列固定在視窗最上方。
    document.body.classList.add('header-hidden');
    var targetY = window.scrollY + dayHeading.getBoundingClientRect().top - dayTabsEl.getBoundingClientRect().height - 12;
    window.scrollTo({ top: Math.max(0, targetY), behavior: 'instant' });
    lastScrollY = window.scrollY;
  });
  mapDayTabsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.tab-btn');
    if (!btn) return;
    selectDay(btn.dataset.day);
  });
  dayCardsEl.addEventListener('click', function (e) {
    var mapButton = e.target.closest('.map-number');
    if (!mapButton) return;
    lastClickedSlotEl = mapButton.closest('.slot');
    backToSlotBtn.hidden = !lastClickedSlotEl;
    document.getElementById('map-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    window.setTimeout(function () {
      travelMap.invalidateSize();
      travelMap.openTravelPoint(Number(mapButton.dataset.displayNumber || mapButton.dataset.mapNumber));
    }, 450);
  });
  backToSlotBtn.addEventListener('click', function () {
    if (!lastClickedSlotEl || !lastClickedSlotEl.isConnected || !lastClickedSlotEl.closest('.day-card.show')) return;
    document.body.classList.add('header-hidden');
    var targetY = window.scrollY + lastClickedSlotEl.getBoundingClientRect().top - dayTabsEl.getBoundingClientRect().height - 16;
    window.scrollTo({ top: Math.max(0, targetY), behavior: 'instant' });
    lastScrollY = window.scrollY;
    lastClickedSlotEl.classList.add('slot-return-highlight');
    window.setTimeout(function () {
      if (lastClickedSlotEl) lastClickedSlotEl.classList.remove('slot-return-highlight');
    }, 1200);
  });
  function scrollToMoreSection(targetId) {
    var targetSection = document.getElementById(targetId);
    if (!targetSection || targetSection.hidden) return;
    setActiveMoreChip(targetId);
    document.body.classList.add('header-hidden');
    var navHeight = moreQuickNavEl ? moreQuickNavEl.getBoundingClientRect().height : 0;
    var targetY = window.scrollY + targetSection.getBoundingClientRect().top - navHeight - 12;
    window.scrollTo({ top: Math.max(0, targetY), behavior: 'instant' });
    lastScrollY = window.scrollY;
  }
  moreQuickNavEl.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-more-target]');
    if (!btn) return;
    scrollToMoreSection(btn.dataset.moreTarget);
  });

  function currentTripState() {
    var today = tripClock(new Date()).date;
    var firstDate = trip.days[0].date;
    var lastDate = trip.days[trip.days.length - 1].date;
    var exactIndex = trip.days.findIndex(function (day) { return day.date === today; });
    if (exactIndex >= 0) return { mode: 'today', dayIndex: exactIndex };
    if (today < firstDate) return { mode: 'before', dayIndex: 0 };
    if (today > lastDate) return { mode: 'after', dayIndex: trip.days.length - 1 };
    var nextIndex = trip.days.findIndex(function (day) { return day.date > today; });
    return { mode: 'between', dayIndex: Math.max(0, nextIndex) };
  }

  function renderHome() {
    var state = currentTripState();
    var day = trip.days[state.dayIndex];
    var slots = day.slots || [];
    var timelineSlots = slots.slice();
    var homeFlights = ((trip.flights || {}).booked || []);
    if (state.dayIndex === 0 && homeFlights[0]) {
      timelineSlots.unshift({ name: homeFlights[0].label, time: homeFlights[0].time, period: 'flight' });
    }
    if (state.dayIndex === trip.days.length - 1 && homeFlights.length) {
      timelineSlots.push({ name: homeFlights[homeFlights.length - 1].label, time: homeFlights[homeFlights.length - 1].time, period: 'flight' });
    }
    var modeText = state.mode === 'today' ? '今日行程' : state.mode === 'before' ? '旅程即將開始' : state.mode === 'after' ? '旅程回顧' : '下一個行程日';
    document.getElementById('homeMode').textContent = modeText;
    document.getElementById('homeDate').textContent = 'DAY ' + (state.dayIndex + 1) + ' · ' + shortDate(day.date) + ' · ' + day.weekday;
    document.getElementById('homeDayTitle').textContent = day.theme || trip.title;
    document.getElementById('homeTheme').textContent = state.mode === 'before' ? '出發前先確認提醒與交通資訊' : '今天的重點已整理在下方';
    document.getElementById('homeTimelineTitle').innerHTML = state.mode === 'today' ? '<span class="n">今日</span> 行程摘要' : '<span class="n">預覽</span> 行程摘要';

    var nextStop = state.mode === 'today' ? nextTripStop(timelineSlots, state, new Date())
      : timelineSlots.length ? { slot: timelineSlots[0], label: '行程起點' } : null;
    document.getElementById('homeNext').innerHTML = nextStop
      ? '<div class="next-label">' + nextStop.label + '</div><div class="next-time">' + escapeHTML(startTime(nextStop.slot.time)) + '</div><div class="next-name">' + escapeHTML(nextStop.slot.name) + '</div>'
      : '<div class="next-label">行程</div><div class="next-name">' + (state.mode === 'today' ? '今日行程已結束' : '尚無行程資料') + '</div>';

    var stay = slots.filter(function (slot) { return slot.period === 'stay'; })[0];
    var today = tripClock(new Date()).date;
    var firstReminder = reminders.find(function (reminder) { return reminder.deadline >= today; }) || reminders[reminders.length - 1];
    var targetDayId = 'day' + (state.dayIndex + 1);
    document.getElementById('homeSummary').innerHTML = [
      '<article class="card summary-card" id="weatherCard"><div class="summary-label">目前天氣</div><div class="summary-value">載入中…</div></article>',
      '<article class="card summary-card summary-card-action" role="button" tabindex="0" data-open-view="more" data-scroll-target="checklist-section"><div class="summary-label">重要提醒<span aria-hidden="true">›</span></div><div class="summary-value">' + escapeHTML(firstReminder ? firstReminder.item : '目前沒有提醒') + '</div><div class="summary-note">' + (firstReminder ? firstReminder.deadline + ' 前' : '') + '</div></article>',
      '<article class="card summary-card summary-card-action" role="button" tabindex="0" data-open-view="schedule" data-select-day="' + targetDayId + '"' + (stay ? ' data-scroll-slot="stay"' : '') + '><div class="summary-label">今晚住宿<span aria-hidden="true">›</span></div><div class="summary-value">' + escapeHTML(stay ? stay.name.replace('今晚住宿：', '') : '依旅程安排') + '</div></article>',
      '<article class="card summary-card summary-card-action" role="button" tabindex="0" data-open-view="schedule" data-select-day="' + targetDayId + '"><div class="summary-label">今日站點<span aria-hidden="true">›</span></div><div class="summary-value">' + timelineSlots.length + ' 個行程</div><div class="summary-note">地圖與時間軸同步</div></article>'
    ].join('');
    updateHomeWeather(state.dayIndex);
    document.getElementById('homeTimeline').innerHTML = timelineSlots.slice(0, 4).map(function (slot, idx) {
      return '<div class="mini-stop mini-stop-action" role="button" tabindex="0" data-open-view="schedule" data-select-day="' + targetDayId + '" data-slot-index="' + idx + '"><div class="mini-time">' + escapeHTML(startTime(slot.time)) + '</div><div class="mini-name">' + escapeHTML(slot.name) + '</div></div>';
    }).join('');
    selectDay(targetDayId);
  }

  function switchView(view) {
    document.body.classList.remove('nav-hidden');
    document.body.classList.remove('header-hidden');
    document.body.classList.toggle('home-active', view === 'home');
    updateHeaderHeight();
    document.querySelectorAll('.app-view').forEach(function (section) {
      section.classList.toggle('active', section.dataset.view === view);
    });
    document.querySelectorAll('.nav-btn').forEach(function (button) {
      button.classList.toggle('active', button.dataset.viewTarget === view);
    });
    if (view === 'schedule') {
      centerActiveDayTabs();
      window.setTimeout(function () {
        travelMap.invalidateSize();
        updateTravelMap(document.querySelector('#mapDayTabs .active').dataset.day);
      }, 50);
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.querySelector('.bottom-nav').addEventListener('click', function (e) {
    var button = e.target.closest('[data-view-target]');
    if (button) switchView(button.dataset.viewTarget);
  });
  var lastScrollY = window.scrollY;
  var scrollTicking = false;
  function updateHeaderHeight() {
    var header = document.querySelector('header.hero');
    document.documentElement.style.setProperty('--app-header-height', header.offsetHeight + 'px');
  }
  updateHeaderHeight();
  window.addEventListener('resize', updateHeaderHeight);
  window.addEventListener('scroll', function () {
    if (scrollTicking) return;
    scrollTicking = true;
    window.requestAnimationFrame(function () {
      var currentScrollY = window.scrollY;
      var delta = currentScrollY - lastScrollY;
      if (currentScrollY < 80 || delta < -8) {
        document.body.classList.remove('nav-hidden', 'header-hidden');
      } else if (currentScrollY > 160 && delta > 8) {
        document.body.classList.add('nav-hidden', 'header-hidden');
      }
      var remainingScroll = document.documentElement.scrollHeight - window.innerHeight - currentScrollY;
      if (remainingScroll <= 100) {
        document.body.classList.remove('nav-hidden');
      }
      lastScrollY = currentScrollY;
      scrollTicking = false;
    });
  }, { passive: true });
  document.querySelector('.bottom-nav').addEventListener('focusin', function () {
    document.body.classList.remove('nav-hidden');
  });
  function handleOpenViewTrigger(trigger) {
    switchView(trigger.dataset.openView);
    if (trigger.dataset.selectDay) selectDay(trigger.dataset.selectDay);
    if (trigger.dataset.scrollTarget) {
      if (trigger.dataset.openView === 'more') {
        scrollToMoreSection(trigger.dataset.scrollTarget);
      } else {
        window.setTimeout(function () {
          var targetEl = document.getElementById(trigger.dataset.scrollTarget);
          if (targetEl) targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
      }
    } else if (trigger.dataset.scrollSlot === 'stay') {
      var stayEl = dayCardsEl.querySelector('.day-card.show .slot-stay');
      if (stayEl) {
        document.body.classList.add('header-hidden');
        var stayY = window.scrollY + stayEl.getBoundingClientRect().top - dayTabsEl.getBoundingClientRect().height - 16;
        window.scrollTo({ top: Math.max(0, stayY), behavior: 'instant' });
        lastScrollY = window.scrollY;
      }
    } else if (trigger.dataset.slotIndex !== undefined) {
      var slotEls = dayCardsEl.querySelectorAll('.day-card.show .slot');
      var slotEl = slotEls[Number(trigger.dataset.slotIndex)];
      if (slotEl) {
        document.body.classList.add('header-hidden');
        var slotY = window.scrollY + slotEl.getBoundingClientRect().top - dayTabsEl.getBoundingClientRect().height - 16;
        window.scrollTo({ top: Math.max(0, slotY), behavior: 'instant' });
        lastScrollY = window.scrollY;
      }
    }
  }
  document.addEventListener('click', function (e) {
    var trigger = e.target.closest('[data-open-view]');
    if (trigger) handleOpenViewTrigger(trigger);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var trigger = e.target.closest('[role="button"][data-open-view]');
    if (!trigger) return;
    e.preventDefault();
    handleOpenViewTrigger(trigger);
  });
  document.getElementById('homeSummary').addEventListener('change', function (e) {
    var select = e.target.closest('.weather-location-select');
    if (!select) return;
    var state = currentTripState();
    if (select.value !== 'current') {
      updateHomeWeather(state.dayIndex, select.value);
      return;
    }
    var card = document.getElementById('weatherCard');
    var locationToken = ++weatherRequestToken;
    card.innerHTML = weatherHeaderHTML('current') + '<div class="summary-value">定位中…</div><div class="summary-note">請依瀏覽器提示允許位置存取</div>';
    if (!navigator.geolocation) {
      card.innerHTML = weatherHeaderHTML('current') + '<div class="summary-value">無法取得位置</div><div class="summary-note">此瀏覽器不支援定位，請選擇東京或野澤</div>';
      return;
    }
    navigator.geolocation.getCurrentPosition(function (position) {
      if (locationToken !== weatherRequestToken) return;
      updateHomeWeather(state.dayIndex, 'current', {
        label: '目前位置',
        lat: position.coords.latitude,
        lng: position.coords.longitude,
        seasonal: '請查看當地預報',
        tenkiUrl: ''
      });
    }, function () {
      if (locationToken !== weatherRequestToken) return;
      card.innerHTML = weatherHeaderHTML('current') + '<div class="summary-value">定位未開啟</div><div class="summary-note">允許位置權限後重試，或選擇東京／野澤</div>';
    }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 });
  });

  function applyTheme(theme) {
    var nextTheme = theme === 'light' ? 'light' : 'dark';
    var toggle = document.getElementById('themeToggle');
    document.documentElement.dataset.theme = nextTheme;
    toggle.querySelector('span').textContent = nextTheme === 'dark' ? '☀' : '☾';
    toggle.setAttribute('aria-label', nextTheme === 'dark' ? '切換為明亮主題' : '切換為暗色主題');
    toggle.title = toggle.getAttribute('aria-label');
  }

  document.getElementById('themeToggle').addEventListener('click', function () {
    applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
  });

  renderHome();
  applyTheme(document.documentElement.dataset.theme);
  switchView('home');
})();
</script>
</body>
</html>
